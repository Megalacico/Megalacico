<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <style>
    .t { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; white-space: pre; }
    .logo { fill: #7aa2f7; }
    .user { fill: #bb9af7; font-weight: bold; }
    .at { fill: #c0caf5; }
    .host { fill: #7dcfff; font-weight: bold; }
    .sep { fill: #565f89; }
    .k { fill: #7aa2f7; font-weight: bold; }
    .v { fill: #c0caf5; }
    .dim { fill: #565f89; }
    .prompt { fill: #9ece6a; font-weight: bold; }
    .cursor { fill: #c0caf5; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

